<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Time</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #eef2ff; }
    main { width: min(90vw, 680px); padding: 3rem; text-align: center; border: 1px solid #29345c; border-radius: 24px; background: #121a33; box-shadow: 0 20px 70px #0006; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2.5rem, 8vw, 5rem); }
    p { color: #aeb9df; font-size: 1.1rem; }
    #clock { margin-top: 2rem; font-variant-numeric: tabular-nums; font-size: clamp(2rem, 8vw, 4rem); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>PC Time</h1>
    <p>Your local time, right in the browser.</p>
    <div id="clock" aria-live="polite"></div>
  </main>
  <script>
    const clock = document.querySelector('#clock');
    const update = () => {
      clock.textContent = new Intl.DateTimeFormat(undefined, {
        dateStyle: 'full', timeStyle: 'medium'
      }).format(new Date());
    };
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
